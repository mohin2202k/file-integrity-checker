<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>File Integrity Checker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="container">
    <h1>File Integrity Checker</h1>
    <p class="subtitle">
      Verify whether a file has been modified using SHA-256 hashing.
    </p>


    <section class="upload">
      <label>Select a file</label>
      <input type="file" id="fileInput" />
    </section>

    <section class="hash-display">
      <h3>Generated SHA-256 Hash</h3>
      <textarea id="generatedHash" readonly></textarea>
    </section>

    <section class="verify">
      <h3>Verify File Integrity</h3>
      <input type="text" id="expectedHash" placeholder="Paste expected hash here" />
      <button id="verifyBtn">Verify</button>
      <p id="result"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
